<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次世代エネルギー銘柄ウォッチャー</title>
<style>
  :root {
    --bg: #fafaf7; --surface: #ffffff; --surface-2: #f1efe8;
    --text: #2c2c2a; --text-secondary: #5f5e5a; --text-tertiary: #888780;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.2);
    --accent: #185FA5; --price-up: #1D9E75; --price-down: #E24B4A;
    --radius-md: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --surface: #2c2c2a; --surface-2: #3a3a37;
      --text: #f1efe8; --text-secondary: #b4b2a9; --text-tertiary: #888780;
      --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.2);
      --accent: #85B7EB; --price-up: #5DCAA5; --price-down: #F09595;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 20px 16px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; max-width: 800px;
  }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .update-btn {
    font-size: 13px; padding: 8px 16px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-strong); background: var(--surface);
    color: var(--text); cursor: pointer; font-family: inherit; font-weight: 500;
  }
  .update-btn:hover { background: var(--surface-2); }
  .update-btn:disabled { opacity: 0.5; cursor: wait; }
  .update-status { font-size: 11px; color: var(--text-tertiary); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 20px 0; }
  .stat-card { background: var(--surface-2); border-radius: var(--radius-md); padding: 12px 14px; }
  .stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 500; }
  .stat-s { color: #993C1D; } .stat-a { color: #854F0B; } .stat-b { color: #185FA5; }
  @media (prefers-color-scheme: dark) {
    .stat-s{color:#F0997B;} .stat-a{color:#EF9F27;} .stat-b{color:#85B7EB;}
  }
  .filters {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
    position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 10;
  }
  .filter-btn {
    font-size: 12px; padding: 6px 12px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border); background: transparent; color: var(--text);
    cursor: pointer; font-family: inherit;
  }
  .filter-btn.active { background: var(--surface-2); font-weight: 500; border-color: var(--border-strong); }
  .search-box {
    width: 100%; padding: 8px 12px; margin-bottom: 12px; font-size: 14px;
    font-family: inherit; border: 0.5px solid var(--border);
    border-radius: var(--radius-md); background: var(--surface); color: var(--text);
  }
  .stock-list { display: flex; flex-direction: column; gap: 8px; }
  .stock-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .stock-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .stock-name { font-size: 15px; font-weight: 500; }
  .stock-code { font-size: 12px; color: var(--text-secondary); font-family: ui-monospace, monospace; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-md); font-weight: 500; }
  .sector-perovskite{background:#EEEDFE;color:#3C3489;} .sector-hydrogen{background:#E6F1FB;color:#0C447C;}
  .sector-iodine{background:#FAEEDA;color:#633806;} .sector-fusion{background:#E1F5EE;color:#085041;}
  .rank-S{background:#FAECE7;color:#712B13;} .rank-A{background:#FAEEDA;color:#633806;} .rank-B{background:#E6F1FB;color:#0C447C;}
  @media (prefers-color-scheme: dark) {
    .sector-perovskite{background:#3C3489;color:#EEEDFE;} .sector-hydrogen{background:#0C447C;color:#E6F1FB;}
    .sector-iodine{background:#633806;color:#FAEEDA;} .sector-fusion{background:#085041;color:#E1F5EE;}
    .rank-S{background:#712B13;color:#FAECE7;} .rank-A{background:#633806;color:#FAEEDA;} .rank-B{background:#0C447C;color:#E6F1FB;}
  }
  .price-row { display: flex; align-items: baseline; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .price-value { font-size: 18px; font-weight: 500; font-family: ui-monospace, monospace; }
  .price-change { font-size: 13px; font-family: ui-monospace, monospace; }
  .price-up { color: var(--price-up); } .price-down { color: var(--price-down); }
  .price-loading { font-size: 12px; color: var(--text-tertiary); font-style: italic; margin: 6px 0; }
  .price-date { font-size: 11px; color: var(--text-tertiary); }
  .stock-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .stock-note { font-size: 12px; color: var(--text-tertiary); }
  .stock-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .action-btn {
    font-size: 11px; padding: 5px 10px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border); background: transparent; color: var(--text);
    text-decoration: none; cursor: pointer; font-family: inherit; display: inline-block;
  }
  .action-btn:hover { background: var(--surface-2); }
  .memo-box {
    width: 100%; margin-top: 10px; padding: 8px 10px; font-size: 13px; font-family: inherit;
    border: 0.5px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg); color: var(--text); resize: vertical; min-height: 36px; display: none;
  }
  .memo-box.active { display: block; }
  footer { margin-top: 32px; padding: 16px; background: var(--surface-2); border-radius: var(--radius-md); font-size: 11px; color: var(--text-secondary); line-height: 1.7; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 14px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>次世代エネルギー銘柄ウォッチャー</h1>
  <p class="subtitle">ペロブスカイト・水素・ヨウ素・核融合 × ランク別</p>
  <div class="header-actions">
    <button class="update-btn" onclick="loadStocksJson()">🔄 最新データ読込</button>
    <button class="update-btn" id="update-prices" onclick="updateAllPrices()">📈 手動更新</button>
    <span class="update-status" id="update-status">読み込み中...</span>
  </div>
</header>

<div class="stats">
  <div class="stat-card"><div class="stat-label">監視銘柄</div><div class="stat-value">25</div></div>
  <div class="stat-card"><div class="stat-label">本命S</div><div class="stat-value stat-s">8</div></div>
  <div class="stat-card"><div class="stat-label">準本命A</div><div class="stat-value stat-a">10</div></div>
  <div class="stat-card"><div class="stat-label">出遅れB</div><div class="stat-value stat-b">7</div></div>
</div>

<input type="text" class="search-box" id="search" placeholder="銘柄名・コードで検索...">

<div class="filters">
  <button data-filter="all" class="filter-btn active">すべて</button>
  <button data-filter="perovskite" class="filter-btn">ペロブスカイト</button>
  <button data-filter="hydrogen" class="filter-btn">水素</button>
  <button data-filter="iodine" class="filter-btn">ヨウ素</button>
  <button data-filter="fusion" class="filter-btn">核融合</button>
  <button data-filter="S" class="filter-btn">本命Sのみ</button>
  <button data-filter="memo" class="filter-btn">メモあり</button>
</div>

<div id="stock-list" class="stock-list"></div>

<footer>
  ⚠ 投資判断は自己責任で。株価はyfinance経由（前日終値）。<br>
  【運用方法】Pythonで <code>py update_stocks.py</code> 実行 → stocks.json をGitHubにアップロード → 「🔄 最新データ読込」をタップ
  <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
    <button class="action-btn" onclick="exportMemos()">メモをJSON出力</button>
    <button class="action-btn" onclick="document.getElementById('import-file').click()">JSONインポート</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importMemos(event)">
  </div>
</footer>

<script>
const stocks = [
  {code:"4204",name:"積水化学工業",sector:"perovskite",rank:"S",desc:"本命中の本命。積水ソーラーフィルム設立、神戸空港実証、1572億円補助金獲得",note:"国策本命。2030年量産フェーズへ"},
  {code:"4118",name:"カネカ",sector:"perovskite",rank:"S",desc:"世界最薄10μm厚を実現、フィルム型で変換効率20%水準、PER10倍と割安",note:"EV車載・ドローン用途で展開。タンデム型でNEDO採択"},
  {code:"4202",name:"日揮ホールディングス",sector:"perovskite",rank:"A",desc:"ペロブスカイト施工・社会実装、「どこでも発電所」構想",note:"施工フェーズ、サプライチェーン上流"},
  {code:"5202",name:"日本板硝子",sector:"perovskite",rank:"A",desc:"中期経営計画でペロブスカイト重点施策、ガラス型コーティング技術",note:"ガラス基板、建材一体型(BIPV)"},
  {code:"5711",name:"三菱マテリアル",sector:"perovskite",rank:"A",desc:"エネコートテクノロジーズに出資、成膜用インクで発電効率1.5倍",note:"素材メーカー、スタートアップ連携"},
  {code:"6245",name:"ヒラノテクシード",sector:"perovskite",rank:"B",desc:"ロールtoロール塗工機を発表、量産装置メーカー",note:"装置投資テーマで物色されやすい"},
  {code:"8593",name:"三菱HCキャピタル",sector:"perovskite",rank:"B",desc:"エネコートテクノロジーズと資本業務提携",note:"リース・ファイナンス側面"},
  {code:"8088",name:"岩谷産業",sector:"hydrogen",rank:"S",desc:"液体水素100%シェア、日本初の商用水素ステーション",note:"水素関連の中核株、川崎重工と液体水素タンク共同開発"},
  {code:"7012",name:"川崎重工業",sector:"hydrogen",rank:"S",desc:"2031年3月期に水素事業で営業利益450億円目標",note:"液化水素サプライチェーン構築"},
  {code:"4091",name:"日本酸素HD",sector:"hydrogen",rank:"A",desc:"アンモニアから高純度水素を回収する装置開発",note:"産業ガス大手、半導体需要も追い風"},
  {code:"5020",name:"ENEOSホールディングス",sector:"hydrogen",rank:"A",desc:"成長事業として水素・再エネ供給に注力、水素ステーション展開",note:"燃料供給インフラ大手"},
  {code:"6331",name:"三菱化工機",sector:"hydrogen",rank:"A",desc:"水素ステーション、水素製造装置メーカー",note:"ステーション設備の本命"},
  {code:"3445",name:"山王",sector:"hydrogen",rank:"B",desc:"パラジウム合金水素透過膜の特許保有、小型株",note:"短期資金が入りやすい小型株"},
  {code:"5659",name:"日本精線",sector:"hydrogen",rank:"B",desc:"パラジウム合金水素分離膜モジュール、半導体・FC向け",note:"ニッチ技術、需給逼迫時に注目"},
  {code:"6391",name:"加地テック",sector:"hydrogen",rank:"B",desc:"高圧水素コンプレッサー、三井E&Sと共同開発",note:"ステーション設備、業界標準化次第"},
  {code:"7240",name:"NOK",sector:"hydrogen",rank:"B",desc:"燃料電池用シール材、耐水素Oリング、水素制御バルブ",note:"FC自動車部品"},
  {code:"4107",name:"伊勢化学工業",sector:"iodine",rank:"S",desc:"ヨウ素国内シェアトップ、AGC子会社、千葉・宮崎に拠点",note:"PER60倍と割高だがヨウ素需要拡大の本丸"},
  {code:"1663",name:"K&Oエナジーグループ",sector:"iodine",rank:"S",desc:"ヨウ素生産大手、千葉県の天然ガス・ヨウ素事業",note:"ヨウ素供給の安定性で投資妙味"},
  {code:"4182",name:"三菱ガス化学",sector:"iodine",rank:"A",desc:"子会社東邦アーステックでヨウ素製造、2026年度フル稼働計画",note:"化学大手、安定供給源"},
  {code:"5803",name:"フジクラ",sector:"fusion",rank:"S",desc:"京都フュージョニアリングに出資、米CFSにレアアース系高温超電導線材納入",note:"電線御三家、超電導技術で世界先行"},
  {code:"5801",name:"古河電気工業",sector:"fusion",rank:"S",desc:"英Tokamak Energyに高温超電導線材を供給、SuperPower経由",note:"ST80-HTS向け100kmの高温超電導材供給"},
  {code:"8031",name:"三井物産",sector:"fusion",rank:"S",desc:"京都フュージョニアリング、米CFS、MiRESSO社に出資",note:"商社として核融合バリューチェーン全体に投資"},
  {code:"6971",name:"京セラ",sector:"fusion",rank:"A",desc:"京都フュージョニアリングとセラミックス共同開発、トリチウム回収部品",note:"シリコンカーバイド複合材を提供"},
  {code:"6965",name:"浜松ホトニクス",sector:"fusion",rank:"A",desc:"高強度レーザーで慣性核融合の実証、産業応用も展開",note:"レーザー核融合方式の本命"},
  {code:"3446",name:"ジェイテックコーポレーション",sector:"fusion",rank:"A",desc:"EX-Fusionと技術提携、X線ミラーでレーザー核融合に挑戦",note:"ナノ加工・計測技術を活用"}
];

const sectorLabels={perovskite:"ペロブスカイト",hydrogen:"水素",iodine:"ヨウ素",fusion:"核融合"};
const rankLabels={S:"本命S",A:"準本命A",B:"出遅れB"};
let currentFilter="all", currentSearch="", priceData={};

// ★ メイン：stocks.jsonを読み込む（Pythonで生成したファイル）
async function loadStocksJson() {
  const status=document.getElementById("update-status");
  status.textContent="読み込み中...";
  try {
    const res=await fetch("stocks.json?t="+Date.now());
    if(!res.ok) throw new Error("not found");
    const json=await res.json();
    if(json.data){ priceData=json.data; status.textContent="最終更新: "+(json.updated||"不明"); renderStocks(); return; }
  } catch(e) {
    status.textContent="stocks.json未取得 → Pythonを実行してアップロードしてください";
  }
  // キャッシュにフォールバック
  try {
    const c=JSON.parse(localStorage.getItem("price_cache")||"{}");
    if(c.data){ priceData=c.data; status.textContent+=" (キャッシュ表示中)"; renderStocks(); }
  } catch(e){}
}

// フォールバック：corsproxy経由のstooq手動取得
async function updateAllPrices() {
  const btn=document.getElementById("update-prices");
  const status=document.getElementById("update-status");
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 取得中...';
  let ok=0,ng=0;
  for(let i=0;i<stocks.length;i++){
    const s=stocks[i];
    try {
      const url="https://corsproxy.io/?"+encodeURIComponent("https://stooq.com/q/l/?s="+s.code+".jp&f=sd2t2ohlcv&h&e=csv");
      const res=await fetch(url);
      const text=await res.text();
      const lines=text.trim().split("\n");
      const h=lines[0].split(","), v=lines[1].split(","), row={};
      h.forEach((k,i)=>row[k.trim()]=v[i]?v[i].trim():"");
      const close=parseFloat(row.Close), open=parseFloat(row.Open);
      if(isNaN(close)||close===0||row.Close==="N/D") throw new Error();
      priceData[s.code]={close,open:isNaN(open)?close:open,change:Math.round((close-(isNaN(open)?close:open))*10)/10,changePercent:Math.round(isNaN(open)||open===0?0:(close-open)/open*10000)/100,date:row.Date||""};
      ok++;
    } catch(e){ ng++; }
    status.textContent=(i+1)+"/"+stocks.length+" 成功"+ok+" 失敗"+ng;
    renderStocks();
    await new Promise(r=>setTimeout(r,200));
  }
  try{localStorage.setItem("price_cache",JSON.stringify({data:priceData,timestamp:Date.now()}));}catch(e){}
  btn.disabled=false; btn.innerHTML="📈 手動更新";
  status.textContent="更新完了: "+new Date().toLocaleString("ja-JP")+" 成功"+ok+"/"+stocks.length;
}

function getMemo(c){try{return localStorage.getItem("memo_"+c)||"";}catch(e){return "";}}
function setMemo(c,t){try{t?localStorage.setItem("memo_"+c,t):localStorage.removeItem("memo_"+c);}catch(e){}}

function renderPrice(code){
  const p=priceData[code];
  if(!p) return '<div class="price-loading">株価未取得</div>';
  const sign=p.change>=0?"+":"", cls=p.change>=0?"price-up":"price-down", arrow=p.change>=0?"▲":"▼";
  return '<div class="price-row"><span class="price-value">¥'+p.close.toLocaleString("ja-JP",{maximumFractionDigits:1})+'</span><span class="price-change '+cls+'">'+arrow+' '+sign+p.change+' ('+sign+p.changePercent+'%)</span><span class="price-date">'+(p.date||"")+'</span></div>';
}

function renderStocks(){
  const list=document.getElementById("stock-list");
  let f=currentFilter==="all"?stocks:currentFilter==="S"?stocks.filter(s=>s.rank==="S"):currentFilter==="memo"?stocks.filter(s=>getMemo(s.code)):stocks.filter(s=>s.sector===currentFilter);
  if(currentSearch){const q=currentSearch.toLowerCase();f=f.filter(s=>s.name.toLowerCase().includes(q)||s.code.includes(q));}
  f=f.sort((a,b)=>{const o={S:0,A:1,B:2};return o[a.rank]!==o[b.rank]?o[a.rank]-o[b.rank]:a.code.localeCompare(b.code);});
  if(!f.length){list.innerHTML='<div class="empty-state">該当する銘柄がありません</div>';return;}
  list.innerHTML=f.map(s=>{
    const m=getMemo(s.code);
    return '<div class="stock-card"><div class="stock-header"><span class="stock-name">'+s.name+'</span><span class="stock-code">'+s.code+'</span><span class="badge sector-'+s.sector+'">'+sectorLabels[s.sector]+'</span><span class="badge rank-'+s.rank+'">'+rankLabels[s.rank]+'</span></div>'+renderPrice(s.code)+'<div class="stock-desc">'+s.desc+'</div><div class="stock-note">💡 '+s.note+'</div><div class="stock-actions"><a class="action-btn" href="https://kabutan.jp/stock/?code='+s.code+'" target="_blank" rel="noopener">株探 ↗</a><a class="action-btn" href="https://minkabu.jp/stock/'+s.code+'" target="_blank" rel="noopener">みんかぶ ↗</a><a class="action-btn" href="https://finance.yahoo.co.jp/quote/'+s.code+'.T" target="_blank" rel="noopener">Yahoo ↗</a><button class="action-btn" onclick="toggleMemo(\''+s.code+'\')">📝 メモ</button></div><textarea class="memo-box '+(m?"active":"") +'" id="memo-'+s.code+'" placeholder="メモ..." onblur="setMemo(\''+s.code+'\',this.value);renderStocks()">'+m+'</textarea></div>';
  }).join("");
}

function toggleMemo(c){const b=document.getElementById("memo-"+c);b.classList.toggle("active");if(b.classList.contains("active"))b.focus();}

function exportMemos(){
  const m={};stocks.forEach(s=>{const v=getMemo(s.code);if(v)m[s.code]=v;});
  const b=new Blob([JSON.stringify(m,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="memos_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(u);
}

function importMemos(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{try{const m=JSON.parse(ev.target.result);Object.keys(m).forEach(c=>setMemo(c,m[c]));renderStocks();alert("完了: "+Object.keys(m).length+"件");}catch(e){alert("読み込み失敗");}};r.readAsText(f);
}

document.querySelectorAll(".filter-btn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");currentFilter=b.dataset.filter;renderStocks();
}));
document.getElementById("search").addEventListener("input",e=>{currentSearch=e.target.value;renderStocks();});

renderStocks();
loadStocksJson();
</script>
</body>
</html>
